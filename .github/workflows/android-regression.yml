name: Android Full Regression
on:
  pull_request:
    paths:
      - '.github/workflows/android-regression.yml'
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be configured}"
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -z "$SDKMANAGER" ]]; then echo "::error::sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - name: Test lint and build normal APK
        run: ./gradlew :domain:test :downloader:test :extractor:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MediaHarvester-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Build ARM64 phone APK
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MediaHarvester-Android-ARM64-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Build ARM64 preview APK
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a -PphonePreview=true --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MediaHarvester-Android-ARM64-EngineFix-Preview-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 7
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest :database:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
          retention-days: 7
